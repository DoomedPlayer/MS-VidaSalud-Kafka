server.port=8085
spring.application.name=ms-vidasalud-kafka-admin

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

vidasalud.kafka.default-partitions=${KAFKA_DEFAULT_PARTITIONS:3}
vidasalud.kafka.default-replicas=${KAFKA_DEFAULT_REPLICAS:3}
vidasalud.kafka.auto-init-topology=true